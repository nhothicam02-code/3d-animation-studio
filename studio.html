function kfEval(a,tt){const n=a.length;if(tt<=a[0].t)return a[0].v;if(tt>=a[n-1].t)return a[n-1].v;let i=1;while(a[i].t<tt)i++;const p=a[i-1],q=a[i];if(p.e==='hold')return p.v;let u=(tt-p.t)/(q.t-p.t);if(p.e!=='lin')u=u*u*(3-2*u);return p.v.map((x,j)=>x+((q.v[j]??x)-x)*u)}
function kfApply(s,tt){for(const ob of kfObjs(s)){const it=ob.it;if(!it.kf)continue;let ch=false;for(const g of KGO){const a=it.kf[g];if(!a||!a.length)continue;const v=kfEval(a,tt);KGF[ob.k][g].forEach((f,j)=>it[f]=Math.round(v[j]*1e4)/1e4);ch=true}if(ch&&ob.k==='3d')place(it)}}
function kfSet(it,k,g,tm){const v=KGF[k][g].map(f=>+(it[f]??(f[0]==='s'?1:0))||0);it.kf=it.kf||{};const a=it.kf[g]=it.kf[g]||[];let key=a.find(x=>Math.abs(x.t-tm)<1e-4);if(key)key.v=v;else{key={id:uid(),t:r5(tm),v,e:'ease'};a.push(key);a.sort((p,q)=>p.t-q.t)}return key}
function autoKey(it){const k=kfKind(it);if(!k||!it.kf)return;const gs=KGO.filter(g=>it.kf[g]&&it.kf[g].length);if(!gs.length)return;
 if(!KF.auto){say('Đối tượng này đã có key — bật ● Auto Key hoặc bấm ◆ để lưu thay đổi, nếu không giá trị sẽ trở về khi đổi khung.');return}
 for(const g of gs)kfSet(it,k,g,kfT());if(TLV==='kf')renderTL()}
function kfInsertSel(w){const it=cur(),k=kfKind(it);if(!k){say('Chọn một nhân vật, mô hình hoặc đối tượng trong khung trước.');return}
 const gs=!w||w==='all'?KGO:[w];KF.sel=new Set(gs.map(g=>kfSet(it,k,g,kfT()).id));touch();renderTL();say('◆ Đã chèn key '+gs.map(g=>KGN[g]).join(' + ')+' tại khung '+(curF()+1)+' cho “'+kfName(it)+'”.');setTimeout(()=>say(''),2500)}
function kfFind(id){for(const ob of kfObjs(sc())){const kf=ob.it.kf;if(!kf)continue;for(const g of KGO){const a=kf[g];if(!a)continue;const key=a.find(x=>x.id===id);if(key)return{ob,g,a,key}}}return null}
function kfDelSel(){if(!KF.sel.size){say('Chưa chọn key nào — bấm vào ◆ trong bảng Keyframe.');return}
 for(const ob of kfObjs(sc())){const kf=ob.it.kf;if(!kf)continue;for(const g of KGO){if(!kf[g])continue;kf[g]=kf[g].filter(k=>!KF.sel.has(k.id));if(!kf[g].length)delete kf[g]}if(!Object.keys(kf).length)delete ob.it.kf}
 KF.sel.clear();touch();renderTL();apply();renderOv()}
function kfBar(){const a=$('kAuto');a.classList.toggle('on',KF.auto);a.textContent=(KF.auto?'● ':'○ ')+'Auto Key';const f=[...KF.sel].map(kfFind).filter(Boolean);$('kInfo').textContent=f.length?'Đã chọn '+f.length+' key':'';if(f.length)$('kEase').value=f[0].key.e||'ease'}
function renderKF(){if(!P)return;const s=sc(),k=$('kf'),fps=P.fmt.fps,ppf=pps/fps,W=Math.max(s.duration,1)*pps,sl=k.scrollLeft,st=k.scrollTop;
 const stp=[1,2,3,5,6,10,12,15,24,30,60,120,240,480].find(v=>v*ppf>=46)||480,nF=Math.floor(s.duration*fps)+1;let tk=(stp>1&&(stp-1)*ppf>=36)?'<span style="left:0">1</span>':'';
 for(let n=stp;n<=nF;n+=stp)tk+='<span style="left:'+(n-1)*ppf+'px">'+n+'</span>';
 const grid='width:'+W+'px;background-size:'+stp*ppf+'px 100%;background-position:'+(stp-1)*ppf+'px 0',objs=kfObjs(s);
 let h='<div class="tlc" style="width:'+(W+LW+40)+'px"><div class="row rul krul"><div class="lab"><span style="color:var(--muted)">Frame</span></div><div class="lane kru" data-kseek style="width:'+W+'px">'+tk+'</div></div>';
 for(const ob of objs){const it=ob.it,kf=it.kf||{},gs=KGO.filter(g=>kf[g]&&kf[g].length),tm={};
  for(const g of gs)for(const q of kf[g])(tm[q.t]=tm[q.t]||[]).push(q.id);
  h+='<div class="row"><div class="lab'+onc(it.id)+'" data-kobj="'+it.id+'" title="'+esc(kfName(it))+'"><span>'+ob.ic+' '+esc(kfName(it))+'</span><button data-kins="'+it.id+'" title="Chèn key Vị trí + Xoay + Scale tại đường xanh">◆</button>'+(gs.length?'<button class="del" data-kclr="'+it.id+'" title="Xóa toàn bộ key của đối tượng này">✕</button>':'')+'</div><div class="lane kl" style="'+grid+'">'
   +Object.keys(tm).map(x=>'<i class="kd ks'+(tm[x].every(i=>KF.sel.has(i))?' on':'')+'" data-ksum="'+it.id+'|'+x+'" data-kobj="'+it.id+'" style="left:'+x*pps+'px"></i>').join('')+'</div></div>';
  for(const g of gs){const a=kf[g];h+='<div class="row krow"><div class="lab" style="padding-left:22px" data-kobj="'+it.id+'"><span style="color:var(--muted)">'+KGN[g]+'</span><button class="del" data-kgd="'+it.id+'|'+g+'" title="Xóa key '+KGN[g]+'">✕</button></div><div class="lane kl" style="'+grid+'">'
   +a.map((q,i)=>i&&a[i-1].v.every((x,j)=>x===q.v[j])?'<b class="kh" style="left:'+a[i-1].t*pps+'px;width:'+(q.t-a[i-1].t)*pps+'px"></b>':'').join('')
   +a.map(q=>'<i class="kd e-'+(q.e||'ease')+(KF.sel.has(q.id)?' on':'')+'" data-kid="'+q.id+'" data-kobj="'+it.id+'" style="left:'+q.t*pps+'px"></i>').join('')+'</div></div>'}}
 h+=objs.length?'':'<div class="hint kfh">Cảnh chưa có đối tượng nào để tạo keyframe. Thêm nhân vật, mô hình, chữ, ảnh hoặc video trước.</div>';
 h+='<div class="hint kfh">Cách làm: chọn một đối tượng (bấm tên ở đây hoặc bấm vào nó trong khung) → kéo đường xanh tới khung muốn (bấm vào thước Frame) → bấm ◆ hoặc phím I để chèn key. Sang khung khác rồi kéo / xoay / đổi cỡ vật khi Auto Key bật để ghi key mới. Kéo ◆ để dời thời điểm, kéo khung chọn nhiều key, Delete để xóa.</div>';
 h+='<div id="kph" style="left:'+(LW+t*pps)+'px"><span>'+(curF()+1)+'</span></div></div>';
 k.innerHTML=h;k.scrollLeft=sl;k.scrollTop=st;kfBar()}
function seekK(e){const r=document.querySelector('#kf .kru');if(!r||!P)return;const f=P.fmt.fps;seek(Math.round(Math.max(0,e.clientX-r.getBoundingClientRect().left)/pps*f)/f)}
function setTLV(v){TLV=v;$('tl').hidden=v==='kf';$('kf').hidden=v!=='kf';$('kfc').hidden=v!=='kf';document.querySelectorAll('#tt [data-tv]').forEach(b=>b.classList.toggle('on',b.dataset.tv===v));renderTL()}
$('tt').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tv)return setTLV(b.dataset.tv);
 if(b.id==='kAuto'){KF.auto=!KF.auto;return kfBar()}
 if(b.dataset.ki)return kfInsertSel(b.dataset.ki);
 if(b.id==='kDel')kfDelSel()};
$('kEase').onchange=e=>{const f=[...KF.sel].map(kfFind).filter(Boolean);if(!f.length)return;f.forEach(x=>x.key.e=e.target.value);touch();renderKF();apply();renderOv()};
$('kf').onclick=e=>{const s=sc();let b;const ob=id=>kfObjs(s).find(x=>x.it.id===id);
 if(b=e.target.closest('[data-kins]')){const o=ob(b.dataset.kins);if(o){sel={id:o.it.id};renderPanel();renderOv();kfInsertSel('all')}return}
 if(b=e.target.closest('[data-kclr]')){const o=ob(b.dataset.kclr);if(o&&confirm('Xóa toàn bộ keyframe của “'+kfName(o.it)+'”?')){delete o.it.kf;touch();renderTL();apply();renderOv()}return}
 if(b=e.target.closest('[data-kgd]')){const[id,g]=b.dataset.kgd.split('|'),o=ob(id);if(o&&o.it.kf){delete o.it.kf[g];if(!Object.keys(o.it.kf).length)delete o.it.kf;touch();renderTL();apply();renderOv()}return}
 if(b=e.target.closest('.lab[data-kobj]')){sel={id:b.dataset.kobj};renderPanel();renderOv();renderTL()}};
$('kf').addEventListener('pointerdown',e=>{if(e.button)return;const s=sc(),d=e.target.closest('.kd');
 if(d){let ids;if(d.dataset.ksum){const[oid,tm]=d.dataset.ksum.split('|'),o=kfObjs(s).find(x=>x.it.id===oid);ids=[];if(o&&o.it.kf)for(const g of KGO)for(const q of o.it.kf[g]||[])if(Math.abs(q.t-+tm)<1e-4)ids.push(q.id)}else ids=[d.dataset.kid];
  if(e.shiftKey){const all=ids.every(i=>KF.sel.has(i));ids.forEach(i=>all?KF.sel.delete(i):KF.sel.add(i))}else if(!ids.every(i=>KF.sel.has(i)))KF.sel=new Set(ids);
  const oid=d.dataset.kobj;if(!sel||sel.id!==oid){sel={id:oid};renderPanel();renderOv()}
  kd={x:e.clientX,moved:false,items:[...KF.sel].map(i=>kfFind(i)).filter(Boolean).map(f=>({f,t0:f.key.t}))};renderKF();e.preventDefault();return}
 if(e.target.closest('[data-kseek]')){ks=true;seekK(e);return}
 if(e.target.closest('.kl')){kb={x:e.clientX,y:e.clientY,shift:e.shiftKey,base:new Set(KF.sel),el:null};e.preventDefault()}});
addEventListener('pointermove',e=>{
 if(ks){seekK(e);return}
 if(kd){const fps=P.fmt.fps,df=Math.round((e.clientX-kd.x)/pps*fps);if(!kd.moved&&!df)return;kd.moved=true;const arrs=new Set();for(const{f,t0}of kd.items){f.key.t=Math.max(0,r5(t0+df/fps));arrs.add(f.a)}arrs.forEach(a=>a.sort((p,q)=>p.t-q.t));renderKF();apply();renderOv();return}
 if(kb){const x0=Math.min(kb.x,e.clientX),y0=Math.min(kb.y,e.clientY),w=Math.abs(e.clientX-kb.x),h=Math.abs(e.clientY-kb.y);if(!kb.el&&w+h<4)return;if(!kb.el){kb.el=document.createElement('div');kb.el.id='kbox';document.body.appendChild(kb.el)}Object.assign(kb.el.style,{left:x0+'px',top:y0+'px',width:w+'px',height:h+'px'})}});
addEventListener('pointerup',e=>{
 if(ks){ks=false;return}
 if(kd){const d=kd;kd=null;if(!d.moved)return;const s=sc(),mv=new Set(d.items.map(i=>i.f.key.id)),arrs=new Set(d.items.map(i=>i.f.a));let mx=0;
  arrs.forEach(a=>{const keep=[];for(const q of a){const j=keep.findIndex(x=>Math.abs(x.t-q.t)<1e-4);if(j<0)keep.push(q);else if(mv.has(q.id)){KF.sel.delete(keep[j].id);keep[j]=q}}a.length=0;a.push(...keep);for(const q of a)if(mv.has(q.id))mx=Math.max(mx,q.t)});
  if(mx>s.duration)s.duration=Math.ceil(mx);touch();renderTL();apply();renderOv();return}
 if(kb){const b=kb;kb=null;if(!b.el){if(!b.shift&&KF.sel.size){KF.sel.clear();renderKF()}return}
  const r=b.el.getBoundingClientRect(),ids=new Set(b.shift?b.base:[]);b.el.remove();
  document.querySelectorAll('#kf .kd:not(.ks)').forEach(n=>{const q=n.getBoundingClientRect();if(q.right>=r.left&&q.left<=r.right&&q.bottom>=r.top&&q.top<=r.bottom)ids.add(n.dataset.kid)});KF.sel=ids;renderKF()}});

/* ---------- Bối cảnh: mô hình 3D đặt vào cảnh (kéo / xoay / đổi cỡ bằng gizmo) ---------- */
const ENVCAT=[['','Tất cả'],['env-ground','Đất & mặt nền'],['env-table','Bàn'],['env-chair','Ghế'],['env-tree','Cây'],['env-room','Phòng học & nội thất'],['env-cloud','Mây'],['env-mountain','Núi'],['env-rock','Đá'],['env-building','Nhà & công trình'],['env-prop','Đồ vật khác']];
const ENVSIZE={'env-ground':12,'env-mountain':8,'env-cloud':3,'env-tree':3,'env-building':5,'env-room':6,'env-table':1.2,'env-chair':.9,'env-rock':.8,'env-prop':1},PM={};
const isModelFile=f=>/\.(glb|fbx|obj)$/i.test(f.name),isProp=id=>!!(P&&sc().props.some(p=>p.id===id));
function getPropModel(p){
 const key=p.src==='loc'?'loc:'+p.ref:p.path;
 return PM[key]||(PM[key]=(async()=>{let buf;
  if(p.src==='loc'){const r=lmodels.find(x=>x.id===p.ref);if(!r)throw Error('mô hình nhập từ máy không còn trong trình duyệt này');buf=await r.blob.arrayBuffer()}
  else{if(!p.path)throw Error('thiếu đường dẫn file');buf=await getItemBytes(p.path)}
  return parseItem((p.ext||String(p.path).split('.').pop()).toLowerCase(),buf)})().catch(x=>{delete PM[key];throw x}))}
async function addProp(p,my){
 const base=await getPropModel(p);if(my!==tok)return;
 const o=skClone(base),mats=[],rm=[];
 o.traverse(n=>{if(n.isLight||n.isCamera){rm.push(n);return}if(n.isSkinnedMesh)n.frustumCulled=false;if(n.material){n.material=Array.isArray(n.material)?n.material.map(m=>m.clone()):n.material.clone();for(const m of[].concat(n.material)){m.userData.t0=m.transparent;m.userData.o0=m.opacity;mats.push(m)}}});
 rm.forEach(n=>n.parent&&n.parent.remove(n));
 const bx=new THREE.Box3().setFromObject(o),sz=bx.getSize(new THREE.Vector3()),c=bx.getCenter(new THREE.Vector3()),mx=Math.max(sz.x,sz.y,sz.z);
 if(!isFinite(mx)||mx<=0)throw Error('mô hình trống hoặc không đọc được hình khối');
 o.position.set(-c.x,-bx.min.y,-c.z);                        // đáy chạm y=0, tâm ở giữa
 const g=new THREE.Group();g.add(o);tscene.add(g);
 R[p.id]={g,o,mats,fit:(ENVSIZE[p.cat]||1.5)/mx,prop:1};place(p)}
function addPropDef(ref,pos){
 const s=sc(),k=ref.slice(0,3),id=ref.slice(4),m=k==='lib'?envLib.find(x=>x.id===id):lmodels.find(x=>x.id===id);if(!m)return;
 const n=s.props.length,cat=m.cat||'',gr=cat==='env-ground',
  p={id:uid(),name:m.name.replace(/\.(glb|fbx|obj)$/i,''),src:k,ref:id,cat,path:m.path||'',ext:m.ext,
   x:pos?pos.x:gr?0:((n%5)-2)*1.2,y:gr?-.02:0,z:pos?pos.z:gr?0:-1.5-Math.floor(n/5)*1.2,
   rx:0,rot:0,rz:0,sx:1,sy:1,sz:1,lock:true,fixed:false,opacity:1};
 s.props.push(p);sel={id:p.id};tab='env';touch();renderTabs();renderPanel();renderTL();renderOv();
 addProp(p,tok).catch(x=>say('Lỗi mô hình “'+p.name+'”: '+x.message))}
async function importModels(fs){const out=[];
 for(const f of fs){if(!isModelFile(f)){say('Bỏ qua '+f.name+': chỉ nhận .glb / .fbx / .obj');continue}
  const rec={id:uid(),name:f.name,type:'mdl',ext:f.name.split('.').pop().toLowerCase(),blob:f};await idb('readwrite',st=>st.put(rec));lmodels.push(rec);out.push(rec)}
 if(out.length)say('Đã nhập '+out.length+' mô hình — bấm thẻ hoặc kéo vào khung để đặt vào cảnh.');
 if(tab==='env'&&P)renderPanel();return out}

  +'<div class="r"><button data-lpg="env:-1"'+(st.p<=0?' disabled':'')+'>‹</button><span style="flex:1;text-align:center">'+(st.p+1)+' / '+n+' · '+l.length+' mô hình</span><button data-lpg="env:1"'+(st.p>=n-1?' disabled':'')+'>›</button></div>'}

function envClick(el,s){
