 if(b&&b.dataset.clip){const ch=s.chars.find(c=>c.id===(sel.c||sel.id)),a=manifest.animations.find(x=>x.id===b.dataset.clip),c={id:uid(),clip:a.id,start:snap(t),dur:r2(a.duration||2),loop:a.loop!==false};ch.clips.push(c);sel={type:'clip',id:c.id,c:ch.id};if(c.start+c.dur>s.duration)s.duration=Math.ceil(c.start+c.dur);touch();renderTL();apply();overlay(1)}

  if(m==='dup'){const q=JSON.parse(JSON.stringify(s));q.id=uid();q.name+=' (bản sao)';P.scenes.splice(si+1,0,q);si++}
  if(m==='up'&&si>0){[P.scenes[si-1],P.scenes[si]]=[P.scenes[si],P.scenes[si-1]];si--}
  if(m==='down'&&si<P.scenes.length-1){[P.scenes[si+1],P.scenes[si]]=[P.scenes[si],P.scenes[si+1]];si++}
  touch();sel=null;renderAll();loadScene()}

 if(d.k){const it=cur();it[d.k]=v;if(sel.type==='clip'&&d.k==='clip'){const a=manifest.animations.find(x=>x.id===v);if(a)it.dur=r2(a.duration);if(R[sel.c])R[sel.c].cur='~'}if(sel.type==='char'){place(it);if(d.k==='name')renderPanel()}const end=(it.start||0)+(it.dur||0);if(end>s.duration)s.duration=Math.ceil(end);renderTL();apply();overlay(1)}
