label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.r>*{flex:1}.r>button{flex:none}

#vEd main{height:calc(100vh - 62px);min-height:560px;display:grid;grid-template-columns:minmax(0,1fr) 380px}

 if(tab==='scene'){const chars=Object.keys(manifest.characters);h='<label>Tên cảnh</label><input data-s="name" value="'+esc(s.name)+'"><label>Nhân vật (dàn cảnh)</label><select data-s="character"><option value="">— chọn —</option>'+chars.map(c=>'<option'+(c===s.character?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="r"><div><label>Thời lượng (giây)</label><input type="number" min="1" step="0.5" data-s="duration" value="'+s.duration+'"></div><div><label>Màu nền</label><input type="color" data-s="bg" value="'+s.bg+'"></div></div><label>Camera</label><div class="r"><button id="camSave">Lưu góc nhìn hiện tại</button><button id="camClr">Tự động</button></div><div class="hint">'+(s.cam?'Đã lưu góc camera.':'Đang dùng camera tự động. Xoay/zoom khung 3D rồi bấm “Lưu góc nhìn”.')+'</div><label>Quản lý cảnh</label><div class="r"><button class="sm" data-m="up">‹ Lên</button><button class="sm" data-m="down">Xuống ›</button><button class="sm" data-m="dup">Nhân bản</button><button class="sm del" data-m="del">Xóa cảnh</button></div>'}
 if(tab==='dlg'){h='<label><input type="checkbox" data-p="tts"'+(P.tts?' checked':'')+'> Đọc thoại bằng giọng máy (vi-VN) khi phát</label>'+s.dialogues.map((d,i)=>'<div class="item">'+inp('dialogues',i,'who',d.who,'text','placeholder="Nhân vật nói"')+'<textarea data-l="dialogues" data-i="'+i+'" data-k="text" placeholder="Lời thoại…">'+esc(d.text)+'</textarea><div class="r">'+inp('dialogues',i,'start',d.start,'number','step="0.5" min="0" title="Bắt đầu (s)"')+inp('dialogues',i,'dur',d.dur,'number','step="0.5" min="0.5" title="Kéo dài (s)"')+del('dialogues',i)+'</div></div>').join('')+'<button style="margin-top:10px;width:100%" data-add="dialogues">+ Thêm thoại</button><div class="hint">Ô số: bắt đầu (giây) · kéo dài (giây).</div>'}
 if(tab==='music'){const m=s.music,b=P.bgm;h='<label>Nhạc nền cả phim (URL hoặc đường dẫn, VD ./music/nen.mp3)</label>'+inp('bgm',0,'url',b.url)+'<label>Âm lượng</label><input type="range" min="0" max="1" step="0.05" data-l="bgm" data-i="0" data-k="vol" value="'+b.vol+'"><label>Nhạc / âm thanh riêng của cảnh</label>'+inp('music',0,'url',m.url)+'<div class="r"><div><label>Âm lượng</label><input type="range" min="0" max="1" step="0.05" data-l="music" data-i="0" data-k="vol" value="'+m.vol+'"></div><div><label>Vào lúc (s)</label>'+inp('music',0,'start',m.start,'number','step="0.5" min="0"')+'</div></div><label>Chọn file để nghe thử (chỉ trong phiên này)</label><input type="file" accept="audio/*" id="mFile"><div class="hint">File trên máy không lưu được vào dự án. Hãy đưa file nhạc vào repo (VD thư mục music/) rồi nhập đường dẫn.</div>'}
 if(tab==='act'){h=s.actions.map((a,i)=>'<div class="item"><select data-l="actions" data-i="'+i+'" data-k="clip"><option value="">— chọn clip —</option>'+manifest.animations.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===a.clip?' selected':'')+'>'+esc(c.name)+' ('+(+c.duration).toFixed(1)+'s)</option>').join('')+'</select><div class="r">'+inp('actions',i,'start',a.start,'number','step="0.5" min="0" title="Bắt đầu (s)"')+'<label style="margin:0;flex:none"><input type="checkbox" data-l="actions" data-i="'+i+'" data-k="loop"'+(a.loop?' checked':'')+'> Lặp</label>'+del('actions',i)+'</div></div>').join('')+'<button style="margin-top:10px;width:100%" data-add="actions">+ Thêm hành động</button><div class="hint">Hành động sau thay thế hành động trước khi tới thời điểm bắt đầu. Clip lấy từ thư viện Motion Lab.</div>'}
 if(tab==='txt'){h=s.texts.map((x,i)=>'<div class="item">'+inp('texts',i,'text',x.text,'text','placeholder="Nội dung chữ"')+'<div class="r">'+inp('texts',i,'start',x.start,'number','step="0.5" min="0" title="Bắt đầu"')+inp('texts',i,'dur',x.dur,'number','step="0.5" min="0.5" title="Kéo dài"')+'</div><div class="r"><select data-l="texts" data-i="'+i+'" data-k="pos">'+[['top','Trên'],['mid','Giữa'],['bot','Dưới']].map(o=>'<option value="'+o[0]+'"'+(o[0]===x.pos?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+inp('texts',i,'size',x.size,'number','min="10" max="120"')+inp('texts',i,'color',x.color,'color')+del('texts',i)+'</div></div>').join('')+'<button style="margin-top:10px;width:100%" data-add="texts">+ Thêm text</button>'}
 $('tab').innerHTML=h}
const DEF={dialogues:()=>({who:'Nhân vật',text:'',start:0,dur:3}),actions:()=>({clip:'',start:0,loop:true}),texts:()=>({text:'Tiêu đề',start:0,dur:3,pos:'mid',size:40,color:'#ffffff'})};
$('strip').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;if(b.dataset.i==='new'){P.scenes.push(mkScene(P.scenes.length+1));si=P.scenes.length-1;touch()}else{si=+b.dataset.i}renderEd();loadScene()};
$('tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;renderEd()}};
$('tab').onchange=e=>{const el=e.target,d=el.dataset,s=sc();if(el.id==='mFile'){const f=el.files[0];if(f){s.music.url=URL.createObjectURL(f);renderTab();say('Đã nạp '+f.name+' (chỉ phiên này)')}return}
 const v=el.type==='checkbox'?el.checked:el.type==='number'||el.type==='range'?+el.value:el.value;
 if(d.p){P[d.p]=v}else if(d.s){s[d.s]=v;if(d.s==='character')loadScene();if(d.s==='bg')tscene.background=new THREE.Color(v);if(d.s==='name'||d.s==='duration')renderEd()}
 else if(d.l){const o=['bgm'].includes(d.l)?P.bgm:d.l==='music'?s.music:s[d.l][+d.i];o[d.k]=v;if(d.l==='actions'&&d.k==='clip'){curAct=-2;apply()}}touch();if(d.l==='actions'||d.l==='dialogues'||d.l==='texts')overlay(true)};
$('tab').onclick=e=>{const el=e.target,d=el.dataset,s=sc();
 if(d.add){s[d.add].push(DEF[d.add]());touch();renderTab()}
 if(d.del){s[d.del].splice(+d.i,1);touch();curAct=-2;renderTab();overlay(true);apply()}
 if(el.id==='camSave'){s.cam={p:camera.position.toArray(),t:controls.target.toArray()};touch();renderTab()}
 if(el.id==='camClr'){s.cam=null;touch();loadScene();renderTab()}
 if(d.m){const m=d.m;if(m==='del'){if(P.scenes.length<2)return alert('Dự án cần ít nhất 1 cảnh.');if(!confirm('Xóa cảnh này?'))return;P.scenes.splice(si,1);si=Math.max(0,si-1)}
  if(m==='dup'){const q=JSON.parse(JSON.stringify(s));q.id=uid();q.name+=' (bản sao)';P.scenes.splice(si+1,0,q);si++}
  if(m==='up'&&si>0){[P.scenes[si-1],P.scenes[si]]=[P.scenes[si],P.scenes[si-1]];si--}
  if(m==='down'&&si<P.scenes.length-1){[P.scenes[si+1],P.scenes[si]]=[P.scenes[si],P.scenes[si+1]];si++}
  touch();renderEd();loadScene()}};

/* ---------- 3D preview + phát ---------- */
let renderer,tscene,camera,controls,model=null,mixer=null,action=null,playing=false,allMode=false,busy=false,t=0,curAct=-2,clipCache={},loadTok=0,ovKey='',lastD=-1,scPend=false;
const loader=new FBXLoader(),aBgm=$('aBgm'),aSc=$('aSc');
function initThree(){if(renderer)return;const el=$('viewport');renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);tscene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,.01,1000);tscene.add(new THREE.HemisphereLight(0xffffff,0x666070,2));const l=new THREE.DirectionalLight(0xffffff,2.2);l.position.set(3,6,5);tscene.add(l);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
 const rs=()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};new ResizeObserver(rs).observe(el);tick()}
const disp=o=>o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material)for(const m of [].concat(n.material))m.dispose()});
async function loadScene(){const s=sc(),my=++loadTok;pause();if(model){tscene.remove(model);disp(model)}model=mixer=action=null;clipCache={};curAct=-2;t=0;lastD=-1;tscene.background=new THREE.Color(s.bg);syncTp();overlay(true);
 if(!s.character){say('Cảnh chưa có nhân vật — vào tab Cảnh để chọn.');return}say('Đang tải '+s.character+'…');
 try{const obj=await loader.loadAsync('./'+encodeURIComponent(s.character));if(my!==loadTok){disp(obj);return}const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3());obj.position.sub(box.getCenter(new THREE.Vector3()));tscene.add(obj);model=obj;
  const fov=camera.fov*Math.PI/180,dist=Math.max(size.y*.5/Math.tan(fov/2),Math.max(size.x,size.z)*.5/(Math.tan(fov/2)*Math.max(camera.aspect,.2)))*1.35+Math.max(size.x,size.z)*.5;camera.near=Math.max(dist/200,.01);camera.far=dist*20;
  if(s.cam){camera.position.fromArray(s.cam.p);controls.target.fromArray(s.cam.t)}else{camera.position.set(0,0,dist);controls.target.set(0,0,0)}camera.updateProjectionMatrix();controls.update();
  mixer=new THREE.AnimationMixer(obj);say('');apply()}catch(e){say('Lỗi: '+e.message+' (cần chạy qua web server/GitHub Pages)')}}
async function getClip(id){if(clipCache[id]!==undefined)return clipCache[id];const e=manifest.animations.find(x=>x.id===id);if(!e||!model)return null;clipCache[id]=null;try{const d=await(await fetch('./'+e.dataPath)).json(),r=mapClip(THREE.AnimationClip.parse(d.clip),model);clipCache[id]=r.clip.tracks.length?r.clip:null}catch{}return clipCache[id]}
async function apply(){if(!mixer||!P)return;const top=sc().actions.map((a,i)=>({a,i})).filter(x=>x.a.clip&&x.a.start<=t).sort((p,q)=>q.a.start-p.a.start)[0],idx=top?top.i:-1;
 if(idx!==curAct){curAct=idx;mixer.stopAllAction();action=null;if(top){const c=await getClip(top.a.clip);if(c&&curAct===idx){action=mixer.clipAction(c);action.setLoop(top.a.loop?THREE.LoopRepeat:THREE.LoopOnce,top.a.loop?Infinity:1);action.clampWhenFinished=true;action.reset().play()}}}
 if(action&&top){const d=action.getClip().duration,x=t-top.a.start;action.time=top.a.loop?x%d:Math.min(x,d);mixer.update(0)}}
function overlay(force){if(!P)return;const s=sc(),d=s.dialogues.findIndex(x=>x.text&&t>=x.start&&t<x.start+x.dur),tx=s.texts.filter(x=>x.text&&t>=x.start&&t<x.start+x.dur),key=d+'|'+tx.map(x=>s.texts.indexOf(x));if(key===ovKey&&!force)return;ovKey=key;
 $('cap').hidden=d<0;$('cap').innerHTML=d>=0?'<b>'+esc(s.dialogues[d].who)+':</b> '+esc(s.dialogues[d].text):'';
 $('ovl').innerHTML=tx.map(x=>'<div class="ot '+esc(x.pos)+'" style="font-size:'+(+x.size||32)+'px;color:'+esc(x.color)+'">'+esc(x.text)+'</div>').join('');
 if(d>=0&&d!==lastD&&playing&&P.tts&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(s.dialogues[d].text);u.lang='vi-VN';speechSynthesis.speak(u)}lastD=d}
function setSrc(a,url,vol){a.volume=Math.min(1,Math.max(0,+vol||0));if(!url){a.removeAttribute('src');a.dataset.u='';return false}if(a.dataset.u!==url){a.src=url;a.dataset.u=url}return true}
function audio(on){if(!on){aBgm.pause();aSc.pause();speechSynthesis&&speechSynthesis.cancel();return}const s=sc();if(setSrc(aBgm,P.bgm.url,P.bgm.vol)&&aBgm.paused)aBgm.play().catch(()=>{});
 scPend=setSrc(aSc,s.music.url,s.music.vol);if(scPend&&t>=s.music.start){aSc.currentTime=t-s.music.start;aSc.play().catch(()=>{});scPend=false}}
function syncTp(){if(!P)return;const d=+sc().duration||1;$('scrub').max=d;$('scrub').value=t;$('tm').textContent=fmt(t)+' / '+fmt(d)}
function play(all){if(!P)return;allMode=all;if(t>=sc().duration-.01)t=0;playing=true;clock2.getDelta();audio(true)}
function pause(){playing=false;if(P||aBgm.src)audio(false)}
async function nextScene(){busy=true;const keep=aBgm.paused;si++;renderEd();await loadScene();t=0;busy=false;playing=true;clock2.getDelta();audio(true);if(keep)aBgm.pause()}
function tick(){requestAnimationFrame(tick);controls.update();renderer.render(tscene,camera)}
const loop=()=>{requestAnimationFrame(loop);const dt=Math.min(clock2.getDelta(),.06);if(!P||!playing||busy)return;t+=dt;const s=sc();
 if(scPend&&t>=s.music.start){aSc.currentTime=0;aSc.play().catch(()=>{});scPend=false}
 if(t>=s.duration){t=s.duration;if(allMode&&si<P.scenes.length-1){nextScene();return}pause()}apply();overlay();syncTp()},clock2=new THREE.Clock();loop();
$('bPlay').onclick=()=>play(false);$('bAll').onclick=()=>{if(si!==0&&!playing){si=0;renderEd();loadScene().then(()=>play(true));return}play(true)};$('bPause').onclick=pause;
$('scrub').oninput=e=>{t=+e.target.value;scPend=false;if(!playing)audio(false);apply();overlay();$('tm').textContent=fmt(t)+' / '+fmt(sc().duration)};

(async()=>{for(const u of['./library/manifest.json','https://raw.githubusercontent.com/nhothicam02-code/3d-animation-studio/main/library/manifest.json']){try{const r=await fetch(u+'?v='+Date.now());if(r.ok){manifest=await r.json();manifest.animations=manifest.animations||[];manifest.characters=manifest.characters||{};break}}catch{}}route()})();
</script></body></html>
