function kfObjs(s){const o=[];for(const c of s.chars)o.push({it:c,k:'3d',ic:'🧍'});for(const c of s.props||[])o.push({it:c,k:'3d',ic:'📦'});for(const tr of s.tracks)for(const x of tr.items){if(V2.includes(x.type))o.push({it:x,k:'2d',ic:ICON[x.type]});else if(x.type==='fx'&&FX.hasGizmo(x.fx))o.push({it:x,k:'3d',ic:ICON.fx})}return o}

function kfReidAll(q){[...q.chars,...(q.props||[]),...q.tracks.flatMap(tr=>tr.items)].forEach(kfReid)}
function kfEval(a,tt){const n=a.length;if(tt<=a[0].t)return a[0].v;if(tt>=a[n-1].t)return a[n-1].v;let i=1;while(a[i].t<tt)i++;const p=a[i-1],q=a[i];if(p.e==='hold')return p.v;let u=(tt-p.t)/(q.t-p.t);if(p.e!=='lin')u=u*u*(3-2*u);return p.v.map((x,j)=>x+((q.v[j]??x)-x)*u)}

   +Object.keys(tm).map(x=>'<i class="kd ks'+(tm[x].every(i=>KF.sel.has(i))?' on':'')+'" data-ksum="'+it.id+'|'+x+'" data-kobj="'+it.id+'" style="left:'+x*pps+'px"></i>').join('')+'</div></div>';

const isModelFile=f=>M.isItemFile(f.name),isProp=id=>!!(P&&sc().props.some(p=>p.id===id));
function getPropModel(p){
 const key=p.src==='loc'?'loc:'+p.ref:p.path;
 return PM[key]||(PM[key]=(async()=>{let buf;
  if(p.src==='loc'){const r=lmodels.find(x=>x.id===p.ref);if(!r)throw Error('mô hình nhập từ máy không còn trong trình duyệt này');buf=await r.blob.arrayBuffer()}
  else{if(!p.path)throw Error('thiếu đường dẫn file');buf=await getItemBytes(p.path)}
  return parseItem((p.ext||String(p.path).split('.').pop()).toLowerCase(),buf)})().catch(x=>{delete PM[key];throw x}))}
async function addProp(p,my){
 const base=await getPropModel(p);if(my!==tok)return;
 const o=skClone(base),mats=[],rm=[];
 o.traverse(n=>{if(n.isLight||n.isCamera){rm.push(n);return}if(n.isSkinnedMesh)n.frustumCulled=false;if(n.material){n.material=Array.isArray(n.material)?n.material.map(m=>m.clone()):n.material.clone();for(const m of[].concat(n.material)){m.userData.t0=m.transparent;m.userData.o0=m.opacity;mats.push(m)}}});
 rm.forEach(n=>n.parent&&n.parent.remove(n));
 const bx=new THREE.Box3().setFromObject(o),sz=bx.getSize(new THREE.Vector3()),c=bx.getCenter(new THREE.Vector3()),mx=Math.max(sz.x,sz.y,sz.z);

 const g=new THREE.Group(),hp=new THREE.Group(),t=li.lt,L=t==='point'?new THREE.PointLight():t==='spot'?new THREE.SpotLight():t==='dir'?new THREE.DirectionalLight():t==='hemi'?new THREE.HemisphereLight():new THREE.AmbientLight();
 g.add(L);if(L.target){L.target.position.set(0,0,-1);g.add(L.target)}
 if(L.shadow){L.shadow.mapSize.set(1024,1024);L.shadow.bias=-.0005;if(L.shadow.camera.isOrthographicCamera){const c=L.shadow.camera;c.left=c.bottom=-8;c.right=c.top=8;c.near=.1;c.far=40}}
 const sp=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true}));hp.add(sp);
 if(L.target)hp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1.2)]),new THREE.LineBasicMaterial({color:0xffffff,depthTest:false})));
 hp.traverse(o=>o.renderOrder=998);g.add(hp);tscene.add(g);return R[li.id]={g,hp,L,sp,lt:t,fit:1,mats:[]}}
function lightsSync(s){if(!SG)return;const ls=LT(s);BL.forEach(l=>l.visible=!ls.length);let sh=false;
 for(const li of ls){const r=lightRt(li),L=r.L;L.color.set(li.color||'#ffffff');L.intensity=li.on===false?0:+li.intensity||0;if(L.groundColor)L.groundColor.set(li.color2||'#666070');
  if(li.lt==='point'||li.lt==='spot'){L.distance=+li.distance||0;L.decay=li.decay??2}if(li.lt==='spot'){L.angle=Math.min(85,Math.max(1,+li.angle||35))*Math.PI/180;L.penumbra=li.penumbra??.4}
  const cs=!!li.shadow&&!!L.shadow&&li.on!==false;L.castShadow=cs;sh=sh||cs;r.sp.material.color.set(li.color||'#ffffff');r.hp.visible=!EXP&&li.helper!==false;place(li)}
 SG.visible=sh;if(sh)for(const k in R){const r=R[k];if(r.o&&!r.shc){r.shc=1;r.o.traverse(n=>{if(n.isMesh)n.castShadow=true})}}}
function addLight(t){const s=sc(),ls=LT(s),n=ls.filter(x=>x.lt===t).length+1,li={id:uid(),name:LTY.find(x=>x[0]===t)[1].split(' (')[0]+' '+n,lt:t,on:true,color:'#ffffff',helper:true,shadow:false,x:(ls.length%5-2)*1.2,z:2,rx:0,rot:0,rz:0,distance:0,decay:2,...LDEF[t]};ls.push(li);touch();setSel(li.id,'light');apply()}
function lightPanel(s){const ls=LT(s);return '<div class="hint">'+(ls.length?'Cảnh có '+ls.length+' đèn riêng — đèn mặc định đã tắt, ánh sáng do bạn điều khiển.':'Chưa có đèn riêng: đang dùng ánh sáng mặc định. Thêm đèn để tự điều khiển.')+' Bấm biểu tượng đèn trong khung để chọn, kéo để dời, dùng gizmo xoay để chỉnh hướng chiếu (đèn rọi / hướng chiếu về phía trục xanh dương −Z).</div><label>Thêm đèn</label><div class="r" style="flex-wrap:wrap">'+LTY.map(([k,n])=>'<button data-ladd="'+k+'">'+LIC[k]+' '+n.split(' (')[0]+'</button>').join('')+'</div><label>Danh sách đèn ('+ls.length+')</label>'+ls.map(l=>'<div style="display:flex;gap:6px;margin:3px 0"><button data-lsel="'+l.id+'" style="flex:1;text-align:left;'+(sel&&sel.id===l.id?'outline:1px solid var(--accent);':'')+'">'+LIC[l.lt]+' '+esc(l.name)+(l.on===false?' (tắt)':'')+'</button><button data-llock="'+l.id+'" title="Khóa / mở khóa kéo thả">'+(l.fixed?'🔒':'🔓')+'</button><button class="del" data-ldel="'+l.id+'" title="Xóa đèn">✕</button></div>').join('')+(cur()&&stype()==='light'?lightFields(cur()).map(([k,l,y])=>field(k,l,y,cur()[k])).join(''):'')}

async function refreshLib(){
 const b=$('bRefresh');if(b.disabled)return;b.disabled=true;b.textContent='↻ Đang tải…';
 try{
  const[m,ci,models]=await Promise.all([K.readJSON('library/manifest.json',null),K.readJSON('characters/custom/index.json',null),K.listModels().catch(()=>[])]);

  if(models.length){for(const f of models)if(!manifest.characters[f])manifest.characters[f]={model:f,thumbnail:''};for(const f of Object.keys(manifest.characters))if(!models.includes(f))delete manifest.characters[f]}
  if(ci&&Array.isArray(ci.characters))custom=sortCustom(ci.characters);

   // nhân vật Custom đang có trong cảnh mà đã được sửa/lưu lại → dựng lại bản mới nhất
   if(s&&!playing&&s.chars.some(c=>c.custom&&R[c.id]&&R[c.id].ver!==((custom.find(x=>x.id===c.custom.id)||{}).updatedAt||''))){const t0=t;await loadScene();t=t0;syncTp();apply()}}
  const msg='Đã làm mới: '+Object.keys(manifest.characters).length+' nhân vật gốc · '+custom.length+' Custom · '+manifest.animations.length+' clip'+(n>=0?' · '+media.filter(x=>x.lib).length+' nguồn media':' (không tải được kho media)');
  say(msg);setTimeout(()=>{if($('say').textContent===msg)say('')},5000);
 }catch(e){say('Không làm mới được: '+e.message)}
 finally{b.disabled=false;b.textContent='↻ Làm mới thư viện'}}
