let loadToken=0;
async function load(){const my=++loadToken;playing=false;if(action)action.stop();if(model){scene.remove(model);model=null}const file=$('model').value,clipId=$('clip').value;status('Đang tải model và clip…');const loader=new FBXLoader();const obj=await loader.loadAsync('./'+encodeURIComponent(file));if(my!==loadToken)return;scene.add(obj);model=obj;obj.updateMatrixWorld(true);fitCameraToObject(obj);const entry=manifest.animations.find(a=>a.id===clipId);if(!entry)throw Error('Không tìm thấy animation');$('loop').checked=entry.loop!==false;const data=await getClipJSON(entry);if(my!==loadToken){scene.remove(obj);if(model===obj)model=null;return}const src=THREE.AnimationClip.parse(data.clip);let sourceRig=null;if(entry.source){try{sourceRig=await loader.loadAsync('./'+encodeURIComponent(entry.source));sourceRig.updateMatrixWorld(true)}catch(e){console.warn('Không tải được rig nguồn để retarget:',e)}}if(my!==loadToken){scene.remove(obj);if(model===obj)model=null;return}obj.updateMatrixWorld(true);const mapped=retargetClip(src,sourceRig,obj);if(!mapped.clip.tracks.length)throw Error('Không tìm được xương tương thích. Đã bỏ qua '+mapped.skipped+'/'+mapped.total+' track; model có thể dùng rig hoặc tên xương khác.');mixer=new THREE.AnimationMixer(obj);action=mixer.clipAction(mapped.clip);action.reset();action.setLoop($('loop').checked?THREE.LoopRepeat:THREE.LoopOnce,$('loop').checked?Infinity:1);action.clampWhenFinished=!$('loop').checked;action.play();playing=true;status('Đã áp dụng '+mapped.mapped+'/'+mapped.total+' track. Ánh xạ '+mapped.boneMap+' xương; hiệu chỉnh '+mapped.corrected+' track xoay. Xương quan trọng: '+(mapped.criticalMap.join(' | ')||'không tìm thấy tên khớp an toàn')+'. Bỏ qua '+mapped.skipped+' track. Không map: '+(mapped.unmappedTracks.slice(0,8).join(', ')||'không có')+(mapped.unmappedTracks.length>8?' … (+'+(mapped.unmappedTracks.length-8)+' track)':''),true)}
async function start(){manifest=await getJSON('library/manifest.json');const root=await fetch('https://api.github.com/repos/'+repo+'/contents/?ref=main');const files=await root.json();const models=files.filter(f=>f.type==='file'&&/\.fbx$/i.test(f.name));$('model').innerHTML=models.map(m=>'<option value="'+m.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+m.name+'</option>').join('');$('clip').innerHTML=manifest.animations.map(a=>'<option value="'+a.id+'">'+a.name+'</option>').join('');if(params.get('model'))$('model').value=params.get('model');if(params.get('clip'))$('clip').value=params.get('clip');renderClipGrid();init3d();await load()}
$('play').onclick=()=>{if(action){action.paused=false;playing=true}};$('pause').onclick=()=>{playing=false;if(action)action.paused=true};$('reload').onclick=()=>load().catch(e=>status(e.message));$('model').onchange=()=>load().catch(e=>status(e.message));$('clipGrid').onclick=e=>{const card=e.target.closest('[data-clip-id]');if(!card)return;$('clip').value=card.dataset.clipId;renderClipGrid();load().catch(err=>status(err.message))};$('clip').onchange=()=>{renderClipGrid();load().catch(e=>status(e.message))};$('loop').onchange=()=>load().catch(e=>status(e.message));start().catch(e=>status(e.message));
</script></body></html>
