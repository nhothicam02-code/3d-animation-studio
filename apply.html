:root{color-scheme:dark;--bg:#101116;--panel:#191b24;--line:#303442;--text:#f4f5f8;--muted:#9da3b4;--accent:#9a83ff;--green:#66d6a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:800}.brand span{color:var(--accent)}main{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.stage{height:min(72vh,650px);min-height:360px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(ellipse,#303241,#171923)}canvas{width:100%;height:100%;display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}select,button{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#222531;color:var(--text)}button{cursor:pointer;margin-top:9px;font-weight:700}.primary{background:var(--accent);color:#171322;border-color:var(--accent)}.status{font-size:12px;color:var(--muted);line-height:1.5;padding:10px;background:#151720;border-radius:9px;margin-top:12px}.good{color:var(--green)}.row{display:flex;gap:8px}.row button{flex:1}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.stage{height:52vh}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><header><div class="brand"><span>3DiS</span> / RETARGET PREVIEW</div><a href="./index.html" style="color:#bcb0ff">← Thư viện</a></header><main><div class="stage" id="stage"></div><aside class="panel"><h2>Áp dụng animation</h2><label>Nhân vật</label><select id="model"></select><label>Animation clip</label><select id="clip"></select><label><input type="checkbox" id="loop" checked style="width:auto"> Lặp liên tục</label><div class="row"><button id="play" class="primary">▶ Phát</button><button id="pause">Ⅱ Dừng</button></div><button id="reload">Tải lại model / clip</button><button id="diagnose">Phân tích rig (rest pose)</button><button id="copyReport">Sao chép báo cáo JSON</button><textarea id="rigReport" rows="8" readonly placeholder="Báo cáo xương sẽ xuất hiện tại đây…" style="width:100%;margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#11131a;color:#dfe2ed;font:11px ui-monospace,monospace;resize:vertical"></textarea><div id="status" class="status">Đang tải thư viện…</div><div class="status">Retarget dùng tên xương và nhóm alias phổ biến để ánh xạ track sang rig đích. Kết quả phụ thuộc cấu trúc xương, rest pose và hướng trục của từng model; model khác biệt lớn có thể cần hiệu chỉnh thêm.</div></aside></main>
<script type="module">
import * as THREE from 'three';import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),repo='nhothicam02-code/3d-animation-studio',params=new URLSearchParams(location.search);let manifest={characters:{},animations:[]},model=null,mixer=null,action=null,renderer,scene,camera,controls,playing=true,sourceRig=null,sourceFile='',targetRestReport=[];
const norm=s=>String(s||'').toLowerCase().replace(/^.*:/,'').replace(/^mixamorig/,'').replace(/[^a-z0-9]/g,'');
const groups={hips:['pelvis','hip'],spine:['spine0','spine01'],spine1:['spine02','chest'],spine2:['spine03','upperchest'],neck:['neck1'],headTop:['headtopend'],lSho:['leftshoulder','leftclavicle','lshoulder','lclavicle'],rSho:['rightshoulder','rightclavicle','rshoulder','rclavicle'],lArm:['leftarm','leftupperarm','lupperarm','larm'],rArm:['rightarm','rightupperarm','rupperarm','rarm'],lFore:['leftforearm','leftlowerarm','lforearm','llowerarm'],rFore:['rightforearm','rightlowerarm','rforearm','rlowerarm'],lHand:['lefthand','lhand'],rHand:['righthand','rhand'],lUp:['leftupleg','leftthigh','leftupperleg','lthigh','lupleg','lupperleg'],rUp:['rightupleg','rightthigh','rightupperleg','rthigh','rupleg','rupperleg'],lLeg:['leftleg','leftlowerleg','leftcalf','leftshin','lcalf','lshin','llowerleg'],rLeg:['rightleg','rightlowerleg','rightcalf','rightshin','rcalf','rshin','rlowerleg'],lFoot:['leftfoot','lfoot'],rFoot:['rightfoot','rfoot']};
const canonical=new Map();for(const [key,alts] of Object.entries(groups)){canonical.set(norm(key),key);for(const a of alts)canonical.set(norm(a),key)}
function keyOf(s){const n=norm(s);return canonical.get(n)||n}
async function getJSON(path){const r=await fetch('https://raw.githubusercontent.com/'+repo+'/main/'+path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Không đọc được '+path+' ('+r.status+')');return r.json()}
async function getClipJSON(entry){try{return await getJSON(entry.dataPath)}catch(firstError){const r=await fetch('https://api.github.com/repos/'+repo+'/contents/library/animations?ref=main',{cache:'no-store'});if(!r.ok)throw firstError;const files=await r.json();for(const file of files.filter(x=>x.type==='file'&&/\\.json$/i.test(x.name))){try{const candidate=await getJSON('library/animations/'+file.name);const meta=candidate.metadata||{};if(meta.id===entry.id||(meta.name===entry.name&&(!entry.source||meta.source===entry.source)))return candidate}catch(e){}}throw firstError}}
function status(s,good=false){$('status').textContent=s;$('status').className='status'+(good?' good':'')}
function init3d(){const el=$('stage');renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0x20222e);camera=new THREE.PerspectiveCamera(35,el.clientWidth/el.clientHeight,.01,1000);camera.position.set(0,2,6);scene.add(new THREE.HemisphereLight(0xffffff,0x666070,2));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(3,6,5);scene.add(l);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;new ResizeObserver(()=>{camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)}).observe(el);function tick(){requestAnimationFrame(tick);if(playing&&mixer)mixer.update(Math.min(clock.getDelta(),.06));controls.update();renderer.render(scene,camera)}tick()}
const clock=new THREE.Clock();
function bonesOf(root){const a=[];root.traverse(o=>{if(o.isBone)a.push(o)});return a}
function roleOf(name){const n=norm(name);if(/hips|pelvis|root/.test(n))return 'hips';if(/spine|chest|torso/.test(n))return 'spine';if(/neck/.test(n))return 'neck';if(/head/.test(n))return 'head';if(/shoulder|clavicle/.test(n))return 'shoulder';if(/forearm|lowerarm|elbow/.test(n))return 'forearm';if(/upperarm|arm/.test(n))return 'arm';if(/hand|wrist/.test(n))return 'hand';if(/upleg|thigh/.test(n))return 'thigh';if(/leg|calf|shin|knee/.test(n))return 'leg';if(/foot|ankle/.test(n))return 'foot';if(/toe/.test(n))return 'toe';return ''}
function sideOf(name){const n=norm(name);if(/left|(^|[^a-z])l/.test(n))return 'L';if(/right|(^|[^a-z])r/.test(n))return 'R';return ''}
function depthOf(b){let d=0;for(let p=b.parent;p&&p.isBone;p=p.parent)d++;return d}
function boneReport(root){if(!root)return [];root.updateMatrixWorld(true);return bonesOf(root).map(b=>{const wp=new THREE.Vector3(),wq=new THREE.Quaternion();b.getWorldPosition(wp);b.getWorldQuaternion(wq);const child=b.children.find(x=>x.isBone);let length=0,direction=null;if(child){const cp=new THREE.Vector3();child.getWorldPosition(cp);const v=cp.sub(wp);length=v.length();if(length>1e-8)direction=v.normalize().toArray().map(n=>+n.toFixed(5))}return {name:b.name,parent:b.parent?.isBone?b.parent.name:(b.parent?.name||''),role:roleOf(b.name),side:sideOf(b.name),depth:depthOf(b),localPosition:b.position.toArray().map(n=>+n.toFixed(5)),localQuaternion:[b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w].map(n=>+n.toFixed(6)),worldPosition:wp.toArray().map(n=>+n.toFixed(5)),worldQuaternion:[wq.x,wq.y,wq.z,wq.w].map(n=>+n.toFixed(6)),firstChildBone:child?.name||null,firstChildLength:+length.toFixed(5),firstChildDirection:direction}})}
function diagnoseRig(){const report={generatedAt:new Date().toISOString(),modelFile:$('model').value,animationClip:$('clip').selectedOptions[0]?.textContent||'',sourceRigFile:sourceFile||null,sourceBoneCount:sourceRig?bonesOf(sourceRig).length:0,targetBoneCount:model?bonesOf(model).length:0,note:'Transforms are captured in imported FBX rest state before animation playback. Child direction is world-space.',sourceBones:boneReport(sourceRig),targetBones:targetRestReport};$('rigReport').value=JSON.stringify(report,null,2);status('Đã tạo báo cáo rig: '+report.sourceBoneCount+' xương nguồn, '+report.targetBoneCount+' xương đích. Hãy sao chép JSON gửi lại để kiểm tra trục/rest pose.',true)}
function retargetClip(sourceClip,sourceRig,target){
 const srcBones=sourceRig?bonesOf(sourceRig):[],dstBones=bonesOf(target),dstExact=new Map(),dstCanonical=new Map();
 for(const b of dstBones){const n=norm(b.name);if(!dstExact.has(n))dstExact.set(n,b);const k=keyOf(b.name);if(!dstCanonical.has(k))dstCanonical.set(k,b)}
 const mapping=new Map(),used=new Set();
 for(const b of srcBones){let d=dstExact.get(norm(b.name))||dstCanonical.get(keyOf(b.name));if(d&&!used.has(d)){mapping.set(b,d);used.add(d)}}
 if(srcBones.length){
  const srcBox=new THREE.Box3().setFromObject(sourceRig),dstBox=new THREE.Box3().setFromObject(target),sh=Math.max(srcBox.getSize(new THREE.Vector3()).y,.0001),dh=Math.max(dstBox.getSize(new THREE.Vector3()).y,.0001);
  const srcPos=new Map(),dstPos=new Map();for(const b of srcBones){const v=new THREE.Vector3();b.getWorldPosition(v);srcPos.set(b,(v.y-srcBox.min.y)/sh)}for(const b of dstBones){const v=new THREE.Vector3();b.getWorldPosition(v);dstPos.set(b,(v.y-dstBox.min.y)/dh)}
  const ordered=srcBones.slice().sort((a,b)=>depthOf(a)-depthOf(b));
  for(const b of ordered){if(mapping.has(b))continue;const role=roleOf(b.name),side=sideOf(b.name),parent=mapping.get(b.parent);if(['hips','foot','toe'].includes(role))continue;let best=null,bestScore=-1e9;
   for(const d of dstBones){if(used.has(d))continue;const dr=roleOf(d.name),ds=sideOf(d.name);let score=0;
    if(role&&dr===role)score+=70;else if(role&&dr)score-=35;
    if(side&&ds)score+=side===ds?35:-100;
    score-=Math.abs(depthOf(b)-depthOf(d))*9;
    score-=Math.abs((srcPos.get(b)||0)-(dstPos.get(d)||0))*22;
    if(parent&&d.parent===parent)score+=55;
    if(!role&&!side)score-=12;
    if(score>bestScore){bestScore=score;best=d}
   }
   if(best&&bestScore>=28){mapping.set(b,best);used.add(best)}
  }
 }
 const srcBoneByName=new Map(srcBones.map(b=>[norm(b.name),b])),tracks=[];let mapped=0,skipped=0,corrected=0;const criticalMap=[];
 for(const [sb,db] of mapping){const role=roleOf(sb.name);if(['hips','foot','toe'].includes(role))criticalMap.push(role+': '+sb.name+' → '+db.name)}
 for(const tr of sourceClip.tracks){let p;try{p=THREE.PropertyBinding.parseTrackName(tr.name)}catch(e){skipped++;continue}
  const srcName=p.nodeName||'',sb=srcBoneByName.get(norm(srcName));let dest=sb?mapping.get(sb):null;
  if(!dest)dest=dstExact.get(norm(srcName))||dstCanonical.get(keyOf(srcName));
  if(!dest){skipped++;continue}
  const clone=tr.clone();clone.name=dest.name+'.'+p.propertyName+(p.propertyIndex!==undefined?'['+p.propertyIndex+']':'');
  if(p.propertyName==='quaternion'&&sb&&sb.quaternion&&dest.quaternion){const correction=dest.quaternion.clone().multiply(sb.quaternion.clone().invert());for(let i=0;i<clone.values.length;i+=4){const q=new THREE.Quaternion(clone.values[i],clone.values[i+1],clone.values[i+2],clone.values[i+3]).premultiply(correction).normalize();clone.values[i]=q.x;clone.values[i+1]=q.y;clone.values[i+2]=q.z;clone.values[i+3]=q.w}corrected++}
  if(p.propertyName==='position'&&sb&&roleOf(sb.name)==='hips'){const srcBox=sourceRig?new THREE.Box3().setFromObject(sourceRig):null,dstBox=new THREE.Box3().setFromObject(target);if(srcBox){const ratio=dstBox.getSize(new THREE.Vector3()).y/Math.max(srcBox.getSize(new THREE.Vector3()).y,.0001);for(let i=0;i<clone.values.length;i++)clone.values[i]*=ratio}}
  tracks.push(clone);mapped++;
 }
 return {clip:new THREE.AnimationClip(sourceClip.name,sourceClip.duration,tracks),mapped,skipped,total:sourceClip.tracks.length,boneMap:mapping.size,sourceBones:srcBones.length,targetBones:dstBones.length,corrected,criticalMap}
}
async function load(){playing=false;if(action)action.stop();if(model){scene.remove(model);model=null}const file=$('model').value,clipId=$('clip').value;status('Đang tải model và clip…');const loader=new FBXLoader();const obj=await loader.loadAsync('./'+encodeURIComponent(file));const bounds=new THREE.Box3().setFromObject(obj),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());obj.position.sub(center);scene.add(obj);model=obj;obj.updateMatrixWorld(true);targetRestReport=boneReport(obj);camera.position.set(0,Math.max(size.y*.1,.1),Math.max(size.length()*1.8,2));controls.target.set(0,0,0);controls.update();const entry=manifest.animations.find(a=>a.id===clipId);if(!entry)throw Error('Không tìm thấy animation');$('loop').checked=entry.loop!==false;const data=await getClipJSON(entry);const src=THREE.AnimationClip.parse(data.clip);sourceRig=null;sourceFile=entry.source||'';if(entry.source){try{sourceRig=await loader.loadAsync('./'+encodeURIComponent(entry.source));sourceRig.updateMatrixWorld(true)}catch(e){console.warn('Không tải được rig nguồn để retarget:',e)}}obj.updateMatrixWorld(true);const mapped=retargetClip(src,sourceRig,obj);if(!mapped.clip.tracks.length)throw Error('Không tìm được xương tương thích. Đã bỏ qua '+mapped.skipped+'/'+mapped.total+' track; model có thể dùng rig hoặc tên xương khác.');mixer=new THREE.AnimationMixer(obj);action=mixer.clipAction(mapped.clip);action.reset();action.setLoop($('loop').checked?THREE.LoopRepeat:THREE.LoopOnce,$('loop').checked?Infinity:1);action.clampWhenFinished=!$('loop').checked;action.play();playing=true;status('Đã áp dụng '+mapped.mapped+'/'+mapped.total+' track. Ánh xạ '+mapped.boneMap+' xương; hiệu chỉnh '+mapped.corrected+' track xoay. Xương quan trọng: '+(mapped.criticalMap.join(' | ')||'không tìm thấy tên khớp an toàn')+'. Bỏ qua '+mapped.skipped+' track.',true)}
async function start(){manifest=await getJSON('library/manifest.json');const root=await fetch('https://api.github.com/repos/'+repo+'/contents/?ref=main');const files=await root.json();const models=files.filter(f=>f.type==='file'&&/\.fbx$/i.test(f.name));$('model').innerHTML=models.map(m=>'<option value="'+m.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+m.name+'</option>').join('');$('clip').innerHTML=manifest.animations.map(a=>'<option value="'+a.id+'">'+a.name+'</option>').join('');if(params.get('model'))$('model').value=params.get('model');if(params.get('clip'))$('clip').value=params.get('clip');init3d();await load()}
$('diagnose').onclick=()=>{try{diagnoseRig()}catch(e){status('Lỗi phân tích rig: '+e.message)}};$('copyReport').onclick=async()=>{if(!$('rigReport').value)diagnoseRig();try{await navigator.clipboard.writeText($('rigReport').value);status('Đã sao chép báo cáo JSON. Hãy dán vào tin nhắn tiếp theo.',true)}catch(e){$('rigReport').focus();$('rigReport').select();status('Không thể tự sao chép. Báo cáo đã được chọn; hãy sao chép thủ công.')}};$('play').onclick=()=>{if(action){action.paused=false;playing=true}};$('pause').onclick=()=>{playing=false;if(action)action.paused=true};$('reload').onclick=()=>load().catch(e=>status(e.message));$('model').onchange=()=>load().catch(e=>status(e.message));$('clip').onchange=()=>load().catch(e=>status(e.message));$('loop').onchange=()=>load().catch(e=>status(e.message));start().catch(e=>status(e.message));
</script></body></html>
