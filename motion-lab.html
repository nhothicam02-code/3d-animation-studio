<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DiS — Motion Lab</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191b24;--panel2:#222531;--line:#303442;--text:#f4f5f8;--muted:#9da3b4;--accent:#9a83ff;--green:#66d6a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#14151c}.brand{font-weight:800;font-size:17px}.brand span{color:var(--accent)}a{color:#c2b5ff;text-decoration:none}main{height:calc(100vh - 62px);min-height:550px;display:grid;grid-template-columns:minmax(0,1fr) 340px}#stage{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 42%,#292b37,#171923 60%,#111219);overflow:hidden}#viewport{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.tag{position:absolute;left:16px;top:16px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#171923cc;font-size:11px}#status{position:absolute;left:16px;bottom:16px;padding:9px 12px;background:#171923dd;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px;max-width:80%}aside{background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto}h2{font-size:16px;margin:0 0 14px}label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}select,button{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}button{cursor:pointer;font-weight:650}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#171322}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.status,.clip-info{margin-top:12px;padding:11px;background:#151720;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.5}.good{color:var(--green)}.bad{color:#ff8585}@media(max-width:800px){main{height:auto;min-height:calc(100vh - 62px);grid-template-columns:1fr}#stage{height:52vh;min-height:350px}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<header><div class="brand"><span>3DiS</span> / MOTION LAB</div><a href="./index.html">← Thư viện</a></header>
<main><section id="stage"><div id="viewport"></div><div class="tag">CHỈ HIỂN THỊ CLIP ĐÃ LƯU TRÊN GITHUB</div><div id="status">Đang tải thư viện…</div></section>
<aside><h2>Phát animation</h2><label>Nhân vật</label><select id="model"></select><label>Animation clip</label><select id="clip"></select><div class="clip-info" id="clipInfo">Chọn clip để xem thông tin.</div><label><input type="checkbox" id="loop" checked style="width:auto"> Lặp liên tục (Loop)</label><div class="row"><button id="play" class="primary">▶ Phát</button><button id="pause">Ⅱ Tạm dừng</button></div><button id="restart" style="margin-top:8px">↺ Phát lại từ đầu</button><button id="reload" style="margin-top:8px">Tải lại model / clip</button><div class="status">Danh sách được đọc trực tiếp từ library/manifest.json. Các animation mẫu và pose dựng sẵn đã được gỡ khỏi Motion Lab.</div></aside></main>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),REPO='nhothicam02-code/3d-animation-studio',params=new URLSearchParams(location.search);
const norm=s=>String(s||'').toLowerCase().replace(/^.*:/,'').replace(/^mixamorig/,'').replace(/[^a-z0-9]/g,'');
const groups={hips:['pelvis','hip'],spine:['spine0','spine01'],spine1:['spine02','chest'],spine2:['spine03','upperchest'],neck:['neck1'],headTop:['headtopend'],lSho:['leftshoulder','leftclavicle','lshoulder','lclavicle'],rSho:['rightshoulder','rightclavicle','rshoulder','rclavicle'],lArm:['leftarm','leftupperarm','lupperarm','larm'],rArm:['rightarm','rightupperarm','rupperarm','rarm'],lFore:['leftforearm','leftlowerarm','lforearm','llowerarm'],rFore:['rightforearm','rightlowerarm','rforearm','rlowerarm'],lHand:['lefthand','lhand'],rHand:['righthand','rhand'],lUp:['leftupleg','leftthigh','leftupperleg','lthigh','lupleg','lupperleg'],rUp:['rightupleg','rightthigh','rightupperleg','rthigh','rupleg','rupperleg'],lLeg:['leftleg','leftlowerleg','leftcalf','leftshin','lcalf','lshin','llowerleg'],rLeg:['rightleg','rightlowerleg','rightcalf','rightshin','rcalf','rshin','rlowerleg'],lFoot:['leftfoot','lfoot'],rFoot:['rightfoot','rfoot']};
const aliases=new Map();for(const [k,arr] of Object.entries(groups)){aliases.set(norm(k),k);for(const n of arr)aliases.set(norm(n),k)}const keyOf=n=>aliases.get(norm(n))||norm(n);
let manifest={animations:[]},model=null,mixer=null,action=null,renderer,scene,camera,controls,playing=false;const clock=new THREE.Clock();
function say(msg,kind=''){ $('status').textContent=msg;$('status').className='status '+kind}
async function json(url){const r=await fetch(url+'?v='+Date.now());if(!r.ok)throw Error('Không đọc được '+url+' ('+r.status+')');return r.json()}
function setup(){const el=$('viewport');renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,.01,1000);camera.position.set(0,1.4,5);scene.add(new THREE.HemisphereLight(0xffffff,0x666070,2));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(3,6,5);scene.add(light);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const resize=()=>{const w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};new ResizeObserver(resize).observe(el);resize();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.06);if(playing&&mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)}tick()}
function mapClip(source,target){const bones=[];target.traverse(o=>{if(o.isBone)bones.push(o)});const exact=new Map(),canon=new Map();for(const b of bones){if(!exact.has(norm(b.name)))exact.set(norm(b.name),b);const k=keyOf(b.name);if(!canon.has(k))canon.set(k,b)}const tracks=[];let mapped=0;for(const tr of source.tracks){let p;try{p=THREE.PropertyBinding.parseTrackName(tr.name)}catch{continue}const dest=exact.get(norm(p.nodeName||''))||canon.get(keyOf(p.nodeName||''));if(!dest)continue;const t=tr.clone();t.name=dest.name+'.'+p.propertyName+(p.propertyIndex!==undefined?'['+p.propertyIndex+']':'');tracks.push(t);mapped++}return {clip:new THREE.AnimationClip(source.name,source.duration,tracks),mapped,total:source.tracks.length}}
function clearModel(){playing=false;if(action)action.stop();if(mixer)mixer.stopAllAction();if(model){scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){for(const m of (Array.isArray(o.material)?o.material:[o.material]))m.dispose()}})}model=null;mixer=null;action=null}
async function loadSelected(){const file=$('model').value,entry=manifest.animations.find(x=>x.id===$('clip').value);if(!file||!entry)throw Error('Chưa có nhân vật hoặc clip trong thư viện GitHub.');clearModel();say('Đang tải '+file+' và '+entry.name+'…');const obj=await new FBXLoader().loadAsync('./'+encodeURIComponent(file));const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());obj.position.sub(center);scene.add(obj);model=obj;const radius=Math.max(size.length()*.5,.5);camera.position.set(radius*.15,radius*.12,radius*2.8);controls.target.set(0,0,0);controls.update();const data=await json(entry.dataPath);if(!data.clip)throw Error('File clip JSON không đúng định dạng.');const source=THREE.AnimationClip.parse(data.clip),mapped=mapClip(source,obj);if(!mapped.clip.tracks.length)throw Error('Không tìm thấy xương tương thích (0/'+mapped.total+' track).');mixer=new THREE.AnimationMixer(obj);action=mixer.clipAction(mapped.clip);const loop=$('loop').checked;action.reset();action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);action.clampWhenFinished=!loop;action.play();playing=true;clock.getDelta();$('clipInfo').textContent=entry.name+' · '+entry.category+' · '+Number(entry.duration||0).toFixed(2)+'s · '+mapped.mapped+'/'+mapped.total+' tracks mapped';say('Đang phát '+entry.name+' trên '+file+'. Ánh xạ '+mapped.mapped+'/'+mapped.total+' track.','good')}
async function start(){say('Đang đọc clip đã lưu trên GitHub…');manifest=await json('https://raw.githubusercontent.com/'+REPO+'/main/library/manifest.json');if(!Array.isArray(manifest.animations))manifest.animations=[];const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/?ref=main');if(!r.ok)throw Error('Không đọc được danh sách model.');const files=await r.json(),models=files.filter(f=>f.type==='file'&&/\.fbx$/i.test(f.name));$('model').innerHTML=models.map(x=>'<option value="'+x.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+x.name+'</option>').join('');if(params.get('model')&&models.some(x=>x.name===params.get('model')))$('model').value=params.get('model');const clips=manifest.animations.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('clip').innerHTML=clips.map(x=>'<option value="'+x.id.replace(/"/g,'&quot;')+'">'+x.name.replace(/[&<>"]/g,'')+' · '+(x.category||'Custom')+'</option>').join('');if(params.get('clip')&&clips.some(x=>x.id===params.get('clip')))$('clip').value=params.get('clip');if(!models.length)throw Error('Repository chưa có file FBX.');if(!clips.length){$('clip').innerHTML='<option value="">Chưa có clip được lưu trên GitHub</option>';$('clipInfo').textContent='Quay lại Thư viện và bấm “Thêm clip” để import FBX.';say('Thư viện GitHub hiện chưa có animation clip.');return}setup();await loadSelected()}
$('play').onclick=()=>{if(action){action.paused=false;playing=true}};$('pause').onclick=()=>{playing=false;if(action)action.paused=true};$('restart').onclick=()=>{if(action){action.reset();action.play();playing=true;clock.getDelta()}};$('reload').onclick=()=>loadSelected().catch(e=>say(e.message,'bad'));$('model').onchange=()=>loadSelected().catch(e=>say(e.message,'bad'));$('clip').onchange=()=>loadSelected().catch(e=>say(e.message,'bad'));$('loop').onchange=()=>loadSelected().catch(e=>say(e.message,'bad'));start().catch(e=>say(e.message,'bad'));
</script></body></html>
